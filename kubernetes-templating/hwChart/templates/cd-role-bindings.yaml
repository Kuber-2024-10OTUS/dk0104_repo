---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cd
  namespace: { { .Release.Namespace } }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-cd-binding
namespace: { { .Release.Namespace } }
subjects:
  - kind: ServiceAccount
    name: cd
    namespace: { { .Release.Namespace } }
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
