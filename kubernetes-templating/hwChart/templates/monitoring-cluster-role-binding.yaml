---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring
  namespace: { { .Release.Namespace } }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: { { .Values.monitoring.clusterRoleName } }
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: { { .Values.monitoring.clusterRoleBindingName } }
subjects:
  - kind: ServiceAccount
    name: monitoring
    namespace: { { .Release.Namespace } }
roleRef:
  kind: ClusterRole
  name: { { .Values.monitoring.clusterRoleName } }
  apiGroup: rbac.authorization.k8s.io
