apiVersion: v1
kind: ServiceAccount
metadata:
  name: custom-op
  namespace: homework
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: custom-op-role
rules:
  - apiGroups: ["apps", "otus.homework"]
    resources:
      - deployments
      - deployments/status
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - update
  - apiGroups: ["", "otus.homework"]
    resources:
      - pods
      - events
      - services
      - persistentvolumes
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - update
  - apiGroups: ["otus.homework"]
    resources:
      - mysqls
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: custom-op-rolebinding
subjects:
  - kind: ServiceAccount
    name: custom
    namespace: homework
roleRef:
  kind: ClusterRole
  name: custom-op-role
  apiGroup: rbac.authorization.k8s.io
