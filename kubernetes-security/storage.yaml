---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hw-pv
  namespace: homework
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/tmp/data/"
  claimRef:
    name: hw-pvc
    namespace: homework
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hw-pvc
  namespace: homework
spec:
  volumeName: hw-pv
  accessModes:
    - ReadWriteMany
  storageClassName: custom-storage-class
  resources:
    requests:
      storage: 250Mi
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: custom-storage-class
  namespace: homework
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"

provisioner: kubernetes.io/minikube-hostpath
reclaimPolicy: Retain
allowVolumeExpansion: true
mountOptions:
  - discard
volumeBindingMode: WaitForFirstConsumer
parameters:
  guaranteedReadWriteLatency: "true"
